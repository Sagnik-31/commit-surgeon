[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commit-surgeon"
version = "0.1.0"
description = "Intelligent Git Workflow Assistant — surgical precision for your commits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sagnik Ghosh" },
]
keywords = ["git", "commit", "workflow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
surgeon = "commit_surgeon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_surgeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
